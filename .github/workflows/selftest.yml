name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow
      - name: Selftests (six scripts)
        run: |
          set -e
          for s in validate_storyboard check_refs init_project make_grid archive_old_docx sync_entity; do
            echo "== $s =="
            python "scripts/$s.py" --selftest
          done
      - name: End-to-end regression on demo project
        run: |
          python scripts/validate_storyboard.py "examples/demo-multi-ep/第1集/分镜/sb.json" --no-log
          python scripts/check_refs.py examples/demo-multi-ep
